[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zelador"
version = "1.0.0"
description = "Ferramenta de manutenção de arquivos para Windows: limpeza de Downloads com motor de regras."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0", "psutil>=5.9", "send2trash>=1.8"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pip-audit"]

[project.scripts]
zelador = "zelador.cli:main"

[tool.setuptools]
packages = ["zelador", "zelador.painel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

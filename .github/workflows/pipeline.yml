
name: Pipeline - Automacao de Arquivos

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  testes:
    name: Testes e verificacoes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # 1. Baixar o codigo
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff pip-audit

      # 4. Verificar sintaxe
      - name: Verificar sintaxe
        run: |
          python -m compileall -q .

      # 5. Analise estatica
      - name: Analise de codigo
        run: |
          ruff check .

      # 6. Testes automatizados
      - name: Executar testes
        run: |
          pytest tests/ -v

      # 7. Verificar vulnerabilidades
      - name: Auditoria de dependencias
        run: |
          pip-audit

      # 8. Validacao final
      - name: Pipeline aprovada
        if: success()
        run: echo "Todas as verificacoes foram aprovadas!"

      - name: Pipeline reprovada
        if: failure()
        run: echo "Falha encontrada! Verifique os logs."
